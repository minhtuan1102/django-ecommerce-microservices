events {
    worker_connections 1024;
}

http {
    server {
        listen 8000;
        listen 80;

        # Global CORS
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;

        location / {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH';
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
                return 204;
            }
            # Fallback for login/register at root
            rewrite ^/login/(.*)$ /auth/login/$1 last;
            rewrite ^/register/(.*)$ /auth/register/$1 last;
        }

        # EXPLICIT MAPPINGS
        location /auth/ {
            proxy_pass http://user-service:8000/;
            proxy_set_header Host $host;
        }

        location /users/ {
            proxy_pass http://user-service:8000/;
            proxy_set_header Host $host;
        }

        location /products/ {
            proxy_pass http://product-service:8000/;
            proxy_set_header Host $host;
        }

        location /cart/ {
            proxy_pass http://cart-service:8000/;
            proxy_set_header Host $host;
        }

        location /orders/ {
            proxy_pass http://order-service:8000/;
            proxy_set_header Host $host;
        }

        location /payment/ {
            proxy_pass http://pay-service:8000/;
            proxy_set_header Host $host;
        }

        location /shipping/ {
            proxy_pass http://ship-service:8000/;
            proxy_set_header Host $host;
        }
        
        location /reviews/ {
            proxy_pass http://comment-rate-service:8000/reviews/;
            proxy_set_header Host $host;
        }

        location /recommend {
            proxy_pass http://ai-service:8000/recommend;
            proxy_set_header Host $host;
        }

        location /chatbot/ {
            proxy_pass http://ai-service:8000/chatbot;
            proxy_set_header Host $host;
        }
    }
}
